[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolution-protocol"
version = "0.6.4"
description = "Evidence-driven anti-collapse governance for multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "love530love"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
agent-evolution = "agent_evolution_protocol.cli:main"
aep = "agent_evolution_protocol.cli:main"
aep-mcp-server = "agent_evolution_protocol.mcp_server:main"

[project.optional-dependencies]
# Test-only dependencies.  ``jsonschema`` is not a runtime requirement: the
# engine writes documents the workspace schemas describe, but only the
# conformance tests need to *validate* against them.
test = ["pytest>=8", "jsonschema>=4.21,<5"]
desktop = ["mcp==1.30.0; python_version >= '3.10'"]
events = ["watchdog>=4.0,<7"]
observability = ["opentelemetry-api>=1.25,<2", "opentelemetry-sdk>=1.25,<2"]
browser = ["playwright>=1.45,<2"]
windows = ["psutil>=5.9,<8; platform_system == 'Windows'", "pywinauto>=0.6.8,<1; platform_system == 'Windows'"]
analytics = ["duckdb>=1.0,<2"]
vectors = ["chromadb>=0.5,<2"]
# Optional federation/execution adapters.  The core package stays dependency-light;
# install only the transport/backend needed by the deployment.
a2a = ["a2a-sdk>=0.3,<1"]
model-routing = ["litellm>=1,<2"]
durable = ["temporalio>=1,<2"]
desktop-agent = ["pyautogui>=0.9,<1", "uiautomation>=2,<3; platform_system == 'Windows'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_evolution_protocol.coordination" = ["*.ps1", "*.html", "*.md", "wake_adapters/*.ps1"]
