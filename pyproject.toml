[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolution-protocol"
version = "0.4.2"
description = "Evidence-driven anti-collapse governance for multi-agent systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "love530love"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
agent-evolution = "agent_evolution_protocol.cli:main"
aep = "agent_evolution_protocol.cli:main"
aep-mcp-server = "agent_evolution_protocol.mcp_server:main"

[project.optional-dependencies]
desktop = ["mcp==1.30.0; python_version >= '3.10'"]
events = ["watchdog>=4.0,<7"]
observability = ["opentelemetry-api>=1.25,<2", "opentelemetry-sdk>=1.25,<2"]
browser = ["playwright>=1.45,<2"]
windows = ["psutil>=5.9,<8; platform_system == 'Windows'", "pywinauto>=0.6.8,<1; platform_system == 'Windows'"]
analytics = ["duckdb>=1.0,<2"]
vectors = ["chromadb>=0.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_evolution_protocol.coordination" = ["*.ps1", "*.html", "*.md", "wake_adapters/*.ps1"]
