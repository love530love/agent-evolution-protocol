name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-desktop-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and verify frozen wheels
        shell: pwsh
        run: ./scripts/prepare-desktop-wheelhouse.ps1 -Action Download
      - name: Install SDK without package index
        shell: pwsh
        run: ./scripts/bootstrap-desktop.ps1 -Python (Get-Command python.exe).Source -Wheelhouse .tools/desktop-wheelhouse -Install
      - name: Verify explicit SDK entry point
        shell: pwsh
        run: |
          & .tools/desktop-sdk/Scripts/python.exe -I -m agent_evolution_protocol --help
          if ($LASTEXITCODE -ne 0) { throw 'SDK module entry failed' }
          ./aep-desktop.ps1 --help
          if ($LASTEXITCODE -ne 0) { throw 'SDK launcher failed' }
          ./aep-desktop.ps1 coord-dependencies --baseline runtime/desktop-win-cp313.lock.json --wheelhouse .tools/desktop-wheelhouse --output .tools/ci-dependency-candidate --apply
          if ($LASTEXITCODE -ne 0) { throw 'Dependency candidate generation failed' }
          ./scripts/prepare-desktop-wheelhouse.ps1 -Action Verify -Directory .tools/desktop-wheelhouse -LockFile .tools/ci-dependency-candidate/candidate.lock.json
          ./aep-desktop.ps1 --coord-root .tools/sdk-acceptance coord-improvement self-test
          if ($LASTEXITCODE -ne 0) { throw 'SDK workflow failed' }
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q
      - run: python -m agent_evolution_protocol --help
      - run: python -m agent_evolution_protocol --coord-root .ci-acceptance coord-improvement self-test
      - name: Portable Windows core (no system Python fallback)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        shell: pwsh
        run: |
          ./scripts/install-portable-python.ps1 -Install
          if ($LASTEXITCODE -ne 0) { throw 'Portable installation failed' }
          ./aep.ps1 --runtime-doctor
          if ($LASTEXITCODE -ne 0) { throw 'Portable integrity check failed' }
          ./aep.ps1 --coord-root .tools/ci-portable-acceptance coord-improvement self-test
          if ($LASTEXITCODE -ne 0) { throw 'Portable workflow acceptance failed' }
